AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DOP-C02 Domain 1 lab - application stack deployed by CodePipeline.
  One template body, deployed to several environments; every environment
  difference arrives through the pipeline's TemplateConfiguration file
  (params/<env>.json), never through the template itself.
  Plain CloudFormation on purpose - the SAM comparison is a separate scenario.

Parameters:
  EnvName:
    Type: String
    Description: Environment name, surfaced to the function as ENV_NAME.
  LogLevel:
    Type: String
    Description: Log level, surfaced to the function as LOG_LEVEL.
  MemorySize:
    Type: Number
    Description: Lambda memory in MB. Differs per environment.

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AppFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: 10
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          LOG_LEVEL: !Ref LogLevel
      Code:
        ZipFile: |
          import json
          import os


          def lambda_handler(event, context):
              body = {
                  "env": os.environ.get("ENV_NAME", "unknown"),
                  "version": "1.0",
              }
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps(body),
              }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "dop-c02-app-${EnvName}"
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AppFunction.Arn
      PayloadFormatVersion: "2.0"

  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiEndpoint:
    Description: Invoke URL. buildspec-integration.yml reads this from stack outputs.
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"
  FunctionName:
    Description: Deployed function name, for lambda get-function-configuration evidence.
    Value: !Ref AppFunction
    Export:
      Name: !Sub "${AWS::StackName}-FunctionName"
