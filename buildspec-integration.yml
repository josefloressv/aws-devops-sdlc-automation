version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install requests pytest
  build:
    commands:
      - |
        export API_URL=$(aws cloudformation describe-stacks \
          --stack-name dop-c02-app-staging \
          --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
          --output text)
      # Single-quoted: the command contains ": " and an unquoted plain scalar
      # would be parsed as a YAML mapping key, not a string.
      - 'echo "Resolved endpoint from stack outputs: $API_URL"'
      - mkdir -p reports
      - pytest tests/integration/ --junitxml=reports/junit-integration.xml
reports:
  IntegrationTestReport:
    files:
      - 'reports/junit-integration.xml'
    file-format: JUNITXML
